# Temporary CI coverage for utils/migrate-namespace.
#
# The tool has its own independent PHPUnit setup that is not part of
# tests/PHPUnit/. This workflow runs it so it is covered by automatic test
# runs. Remove this file together with utils/migrate-namespace/ once the
# Piwik\ -> Matomo\ migration is complete.

name: Migrate Namespace tests

on:
  pull_request:
    paths:
      - 'utils/migrate-namespace/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/migrate-namespace-tests.yml'
  push:
    branches:
      - '[0-9]+.x-dev'
      - '[0-9]+.[0-9]+.x-dev'
      - 'next_release'
    paths:
      - 'utils/migrate-namespace/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/migrate-namespace-tests.yml'
  workflow_dispatch:

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  migrate-namespace:
    name: Migrate Namespace (PHP 8.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          submodules: true
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Install dependencies
        run: composer install --dev --prefer-dist --no-progress --no-interaction
      - name: Run tests
        run: vendor/bin/phpunit -c utils/migrate-namespace/phpunit.xml.dist
